  {task:{n:"9 · (14 + 15)",cond:"В первый ларёк привезли 8 ящиков по 10 кг яблок, а во второй ларёк в 2 раза больше килограммов яблок. Сколько всего килограммов яблок привезли в ларьки?",short:[{g:["I ларёк (л.) — 8 ящиков по 10 кг","II ларёк (л.) — в 2 раза больше кг, ?"],lab:"? кг"}],sol:["1) 10 · 8 = 80 (кг) — в I ларёк","2) 80 · 2 = 160 (кг) — во II ларёк","3) 160 + 80 = 240 (кг) — в оба ларька","Выражение: 10 · 8 + 10 · 8 · 2 = 240 (кг)"],ans:"240 килограммов яблок привезли в оба ларька."}},
  {task:{n:"10 · (14 + 18)",cond:"В 7 одинаковых коробках 28 кг винограда. Сколько килограммов винограда в 4 таких коробках?",short:"7 коробок (к.) — 28 кг\n4 коробки (к.) — ? кг",reason:"чтобы узнать, сколько кг в 4 коробках, нужно сначала узнать, сколько кг в одной коробке.",sol:["1) 28 : 7 = 4 (кг) — в 1 коробке","2) 4 · 4 = 16 (кг) — в 4 коробках","Выражение: 28 : 7 · 4 = 16 (кг)"],ans:"16 килограммов винограда в 4 коробках."}},
  {task:{n:"11 · (14 + 12)",cond:"I звёздочка посадила 3 ряда по 5 яблонь, а II — 2 ряда по 4 яблони. На сколько больше яблонь посадила I звёздочка?",short:[{g:["I звёздочка (зв.) — 3 ряда по 5 яблонь","II звёздочка (зв.) — 2 ряда по 4 яблони"],lab:"на ? яблонь"}],sol:["1) 5 · 3 = 15 (ябл.) — посадила I звёздочка","2) 4 · 2 = 8 (ябл.) — посадила II звёздочка","3) 15 − 8 = 7 (ябл.)","Выражение: 5 · 3 − 4 · 2 = 7 (ябл.)"],ans:"на 7 яблонь больше посадила I звёздочка."}},
  {task:{n:"12 · (14 + 18 + 9)",cond:"В столовой за неделю израсходовали 60 кг муки. 4 дня расходовали по 12 кг муки в день, а остальную муку поровну в следующие 3 дня. Сколько кг муки в день расходовали в последние дни?",short:[{g:["4 дня — по 12 кг","3 дня — по ? кг"],lab:"60 кг"}],sol:["1) 12 · 4 = 48 (кг) — израсходовано за 4 дня","2) 60 − 48 = 12 (кг) — израсходовано за 3 дня","3) 12 : 3 = 4 (кг) — в день в последние дни","Выражение: (60 − 12 · 4) : 3 = 4 (кг)"],ans:"по 4 килограмма муки расходовали в день в последние дни."}},
  {task:{n:"13 · (17 + 12)",cond:"5 ящиков со сливами весят 35 кг, а 4 ящика с виноградом — 48 кг. На сколько легче ящик со сливами?",short:[{g:["1 ящик слив (ящ.) — (35 : 5) кг","1 ящик винограда (ящ.) — (48 : 4) кг"],lab:"на ? кг"}],sol:["1) 35 : 5 = 7 (кг) — весит ящик слив","2) 48 : 4 = 12 (кг) — весит ящик винограда","3) 12 − 7 = 5 (кг)","Выражение: 48 : 4 − 35 : 5 = 5 (кг)"],ans:"на 5 килограммов легче ящик слив."}},
  {task:{n:"14 · (17 + 2)",cond:"Мастер за 8 часов делает 80 деталей, а его ученик за 5 часов делает 25 деталей. За сколько часов они сделают 45 деталей, если будут работать вместе?",short:[{g:["Мастер — (80 : 8) дет./час","Ученик — (25 : 5) дет./час"],lab:"45 деталей за ? часов"}],sol:["1) 80 : 8 = 10 (дет./час) — делает мастер","2) 25 : 5 = 5 (дет./час) — делает ученик","3) 10 + 5 = 15 (дет./час) — делают вместе","4) 45 : 15 = 3 (ч)","Выражение: 45 : (80 : 8 + 25 : 5) = 3 (ч)"],ans:"за 3 часа мастер и ученик сделают 45 деталей, если будут работать вместе."}},
  {task:{n:"15 · (17 + 9)",cond:"Мастер за 8 часов делает 120 деталей. Ученик и мастер вместе делают 120 деталей за 5 часов. Сколько деталей в час делает ученик?",short:[{g:["Мастер — (120 : 8) дет./час","Ученик — ? дет./час"],lab:"(120 : 5) дет./час"}],sol:["1) 120 : 8 = 15 (дет./час) — делает мастер","2) 120 : 5 = 24 (дет./час) — делают вместе","3) 24 − 15 = 9 (дет./час) — делает ученик","Выражение: 120 : 5 − 120 : 8 = 9 (дет./час)"],ans:"9 деталей в час делает ученик."}},
  {task:{n:"16 · (18 + 2)",cond:"У Миши было 13 рублей, а у Оли — 14 рублей. Сколько билетов в кино они могут купить, если один билет стоит 3 рубля?",short:["1 билет — 3 рубля","? билетов — (13 + 14) рублей"],sol:["1) Сколько денег всего было у детей? 13 + 14 = 27 (руб.)","2) Сколько билетов они смогут купить? 27 : 3 = 9 (билетов)","Выражение: (13 + 14) : 3 = 9 (б.)"],ans:"9 билетов в кино дети смогут купить."}}]},

 {id:"z9",n:"10",title:"Задачи на дроби",body:[
  {p:"В дроби 5/9 число <b>5</b> — числитель, число <b>9</b> — знаменатель."},
  {rule:"Чтобы найти дробь числа, нужно число разделить на знаменатель, а потом умножить на числитель."},
  {task:{n:"Задача 17",cond:"У Мити было 15 марок, 3/5 он наклеил в альбом. Сколько марок наклеил Митя?",short:"Было — 15 марок\nНаклеил — 3/5, ? марок",reason:"сначала нахожу 1/5 числа, а потом 3/5.",sol:["15 : 5 · 3 = 9 (м.)"],ans:"9 марок наклеил Митя."}},
  {rule:"Чтобы найти число по дроби, нужно число разделить на числитель и умножить на знаменатель."},
  {task:{n:"Задача 18",cond:"От ленты отрезали 3/4 — это 12 метров. Чему равна была длина всей ленты?",short:"12 м — 3/4\nВся лента — ? м",reason:"сначала нахожу 1/4, а потом целое число.",sol:["12 : 3 · 4 = 16 (м)"],ans:"16 метров была длина всей ленты."}}]},

 {id:"z10",n:"11",title:"Составные задачи на цену, количество, стоимость",body:[
  {task:{n:"19, первый вариант",cond:"Мама купила несколько пирожков с капустой по 5 рублей за штуку и столько же пирожков с мясом по 10 рублей за штуку. За пирожки с капустой она уплатила 30 рублей. Сколько стоили пирожки с мясом?",cols:{head:["","Ц","К","Ст"],rows:[["с капустой (к.)","5 руб.",{v:"одинаковое",rs:2},"30 руб."],["с мясом (м.)","10 руб.",null,"? руб."]]},reason:"чтобы найти стоимость пирожков с мясом, нужно знать их цену и количество. Цену знаем. Количество пирожков с мясом и капустой одинаковое — находим количество пирожков с капустой.",sol:["1) К = Ст : Ц → 30 : 5 = 6 (шт.) — количество пирожков с капустой","2) Ст = Ц · К → 10 · 6 = 60 (руб.) — стоимость пирожков с мясом"],ans:"60 рублей стоили пирожки с мясом."}},
  {task:{n:"19, второй вариант",cond:"Мама купила 5 ложек и 8 вилок по одинаковой цене. За ложки мама заплатила 100 рублей. Сколько стоили вилки?",cols:{head:["","Ц","К","Ст"],rows:[["ложки (л.)",{v:"одинаковая",rs:2},"5 шт.","100 руб."],["вилки (в.)",null,"8 шт.","? руб."]]},sol:["1) Ц = Ст : К → 100 : 5 = 20 (руб.) — цена ложек, она же цена вилок","2) Ст = Ц · К → 20 · 8 = 160 (руб.) — стоимость вилок","Выражение: 100 : 5 · 8 = 160 (руб.)"],ans:"160 рублей мама заплатила за вилки."}},
  {task:{n:"20",cond:"Мама купила 2 рубашки по 40 рублей и 3 платья. За всю покупку она заплатила 230 рублей. Сколько стоит 1 платье?",cols:{head:["","Ц","К","Ст"],rows:[["рубашки (р.)","40 руб.","2 шт.","? руб."],["платья (пл.)","? руб.","3 шт.","? руб."]],brace:"230 руб."},sol:["1) Сколько стоили рубашки? Ст = Ц · К → 40 · 2 = 80 (руб.)","2) Сколько стоили платья? 230 − 80 = 150 (руб.)","3) Чему равна цена платья? Ц = Ст : К → 150 : 3 = 50 (руб.)","Выражение: (230 − 40 · 2) : 3 = 50 (руб.)"],ans:"50 рублей цена платья."}},
  {task:{n:"21",cond:"Две девочки купили 5 метров ленты по одинаковой цене. Одна уплатила 15 рублей, другая — 10 рублей. Сколько метров ленты купила каждая девочка?",cols:{head:["","Ц","К","Ст"],rows:[["I девочка (д.)",{v:"одинаковая",rs:2},"? м","10 руб."],["II девочка (д.)",null,"? м","15 руб."]],brace:"5 м"},reason:"чтобы найти количество, мы должны знать цену и стоимость. Мы знаем общее количество, найдём общую стоимость; зная их, найдём цену, а затем узнаем, сколько метров ленты купила каждая девочка.",sol:["1) Сколько денег заплатили обе девочки? 10 + 15 = 25 (руб.)","2) Чему равна цена ленты? Ц = Ст : К → 25 : 5 = 5 (руб.)","3) К = Ст : Ц → 10 : 5 = 2 (м) — купила I девочка","4) К = Ст : Ц → 15 : 5 = 3 (м) — купила II девочка (или 5 − 2 = 3)"],ans:"2 метра ленты купила I девочка, 3 метра — II девочка."}},
  {task:{n:"22",cond:"В I куске 3 метра ткани, а во II — 7 метров ткани. Второй кусок стоит на 240 рублей дороже. Сколько стоит каждый кусок?",cols:{head:["","Ц","К","Ст"],rows:[["I кусок (к.)",{v:"одинаковая",rs:2},"3 м","? руб."],["II кусок (к.)",null,"7 м","? руб., на 240 руб. дороже"]]},reason:"чтобы найти стоимость, надо знать цену и количество. Чтобы узнать цену — стоимость и количество. Мы знаем, что стоимость второго куска на 240 рублей больше, потому что второй кусок больше первого. Зная разность стоимостей, узнаем разность количеств и тогда сможем найти цену.",sol:["1) На сколько метров II кусок больше I? 7 − 3 = 4 (м)","2) Чему равна цена ткани? Ц = Ст : К → 240 : 4 = 60 (руб.)","3) Ст = Ц · К → 60 · 3 = 180 (руб.) — стоит первый кусок","4) Ст = Ц · К → 60 · 7 = 420 (руб.) — стоит второй кусок (или 180 + 240 = 420)"],ans:"180 рублей стоит первый кусок ткани; 420 рублей — второй."}}]},

 {id:"z11",n:"12",title:"Задачи на движение (составные)",body:[
  {p:"Краткое условие задач на движение можно оформлять в форме чертежа или в форме таблицы. На чертеже квадратик — место встречи, стрелки — направление движения, скоба снизу — всё расстояние."},
  {task:{n:"23, навстречу друг другу",cond:"Из двух городов навстречу друг другу выехали две машины. Скорость первой — 80 км/ч, скорость второй — 60 км/ч. Через сколько часов машины встретятся, если расстояние между городами 280 километров?",short:["I машина — 80 км/ч","II машина — 60 км/ч","Расстояние между городами — 280 км","Время до встречи — ? ч"],draw:{type:"meet",v1:"V₁ = 80 км/ч",v2:"V₂ = 60 км/ч",t:"t = ?",s:"S = 280 км"},reason:"чтобы найти время, нужно расстояние разделить на скорость. Находим скорость сближения.",sol:["1) 80 + 60 = 140 (км/ч) — скорость сближения двух машин","2) t = S : V → 280 : 140 = 2 (ч) — время движения до встречи"],ans:"через 2 часа машины встретятся."}},
  {task:{n:"23, в противоположных направлениях",cond:"Из города в противоположных направлениях выехали две машины. Скорость первой — 80 км/ч, скорость второй — 60 км/ч. Через сколько часов расстояние между машинами будет 280 километров?",short:["I машина — 80 км/ч","II машина — 60 км/ч","Расстояние между машинами — 280 км","Время — ? ч"],draw:{type:"apart",v1:"V₁ = 80 км/ч",v2:"V₂ = 60 км/ч",t:"t = ?",s:"S = 280 км"},reason:"чтобы найти время, нужно расстояние разделить на скорость. Находим скорость удаления.",sol:["1) 80 + 60 = 140 (км/ч) — скорость удаления двух машин","2) t = S : V → 280 : 140 = 2 (ч) — время движения"],ans:"через 2 часа расстояние между машинами будет 280 километров."}},
  {task:{n:"24",cond:"Из двух городов, расстояние между которыми 340 километров, выехали одновременно навстречу друг другу две машины. Скорость первой — 80 км/ч. С какой скоростью ехала вторая машина, если встретились они через 2 часа?",short:["I машина — 80 км/ч","II машина — ? км/ч","Время до встречи — 2 ч","Расстояние между городами — 340 км"],draw:{type:"meet",v1:"V₁ = 80 км/ч",v2:"V₂ = ?",t:"t = 2 ч",s:"S = 340 км"},sol:["1) Чему равна скорость сближения двух машин? V = S : t → 340 : 2 = 170 (км/ч)","2) Чему равна скорость второй машины? 170 − 80 = 90 (км/ч)"],ans:"90 км/ч скорость второй машины."}},
  {task:{n:"24, в противоположных направлениях",cond:"Из города одновременно в противоположных направлениях выехали две машины. Скорость первой — 80 км/ч. С какой скоростью ехала вторая машина, если через два часа расстояние между ними было 340 километров?",short:["I машина — 80 км/ч","II машина — ? км/ч","Время — 2 ч","Расстояние между машинами — 340 км"],draw:{type:"apart",v1:"V₁ = 80 км/ч",v2:"V₂ = ? км/ч",t:"t = 2 ч",s:"S = 340 км"},sol:["1) V = S : t → 340 : 2 = 170 (км/ч) — скорость удаления двух машин","2) 170 − 80 = 90 (км/ч) — скорость второй машины"],ans:"90 км/ч скорость второй машины."}},
  {p:"Аналогично решаются задачи на нахождение расстояния."},
  {task:{n:"25",cond:"Первая машина проходит расстояние 360 км между городами за 6 часов. Вторая — за 3 часа. Через сколько часов они встретятся, если одновременно выедут навстречу друг другу?",short:["I машина — 360 км за 6 ч","II машина — 360 км за 3 ч","Расстояние между городами — 360 км","Время до встречи — ? ч"],draw:{type:"meet",v1:"V₁ = (360 : 6) км/ч",v2:"V₂ = (360 : 3) км/ч",t:"t = ?",s:"S = 360 км"},reason:"чтобы найти время, надо знать расстояние и скорость каждой машины. Первая машина проезжает 360 км за 6 часов, значит её скорость (360 : 6) км/ч, а скорость второй машины (360 : 3) км/ч.",sol:["1) V₁ = S : t₁ → 360 : 6 = 60 (км/ч) — скорость первой машины","2) V₂ = S : t₂ → 360 : 3 = 120 (км/ч) — скорость второй машины","3) 60 + 120 = 180 (км/ч) — скорость сближения","4) t = S : V → 360 : 180 = 2 (ч) — время движения до встречи"],ans:"через 2 часа встретятся машины."}}]}
]},
{id:"prav",title:"2. Правила вычисления",topics:[
 {id:"v1",n:"1",title:"Прибавить и вычесть 1. Сравнение чисел",body:[
  {rule:"Прибавить 1 — значит назвать следующее число. Вычесть 1 — значит назвать предыдущее число."},
  {rule:"Чтобы узнать, <b>на сколько</b> одно число больше или меньше другого, надо из большего числа вычесть меньшее.<br>Чтобы узнать, <b>во сколько раз</b> одно число больше или меньше другого, нужно большее число разделить на меньшее."}]},
 {id:"v2",n:"2",title:"Сумма",body:[
  {ex:"2 (1 слагаемое) + 3 (2 слагаемое) = 5 (сумма)"},
  {ol:["От перестановки слагаемых сумма не изменяется: а + в = в + а.","Самое большое число в сумме — сумма.","Сумма равна одному из слагаемых, если другое слагаемое равно 0: 4 + 0 = 4, т. е. а + 0 = а.","Чтобы найти неизвестное слагаемое, нужно из суммы вычесть известное слагаемое."]},
  {ex:"5 + х = 8; х = 8 − 5; х = 3; проверка: 5 + 3 = 8"}]},
 {id:"v3",n:"3",title:"Разность",body:[
  {ex:"5 (уменьшаемое) − 2 (вычитаемое) = 3 (разность)"},
  {ol:["Самое большое число в разности — уменьшаемое.","Уменьшаемое равно разности, если вычитаемое равно 0: 6 − 0 = 6, т. е. а − 0 = а.","Разность равна 0, если уменьшаемое равно вычитаемому: 8 − 8 = 0, т. е. а − а = 0.","Чтобы найти неизвестное уменьшаемое, нужно к вычитаемому прибавить разность: х − 3 = 5; х = 3 + 5; х = 8.","Чтобы найти неизвестное вычитаемое, нужно из уменьшаемого вычесть разность: 8 − х = 5; х = 8 − 5; х = 3."]}]},
 {id:"v4",n:"4",title:"Увеличить и уменьшить",body:[
  {rule:"Увеличить число на несколько единиц — значит прибавить. Увеличить число в несколько раз — значит умножить.<br>Уменьшить число на несколько единиц — значит вычесть. Уменьшить число в несколько раз — значит разделить."}]},
 {id:"v5",n:"5",title:"Произведение",body:[
  {ex:"2 (I множитель) · 3 (II множитель) = 6 (произведение)"},
  {ol:["Самое большое число в произведении — произведение.","Произведение равно 0, если один из множителей равен 0: 7 · 0 = 0, т. е. а · 0 = 0.","Произведение равно одному из множителей, если другой множитель равен 1: 8 · 1 = 8, т. е. а · 1 = а.","От перестановки множителей произведение не меняется: 5 · 6 = 30; 6 · 5 = 30, т. е. а · в = в · а.","Чтобы найти неизвестный множитель, надо произведение разделить на известный множитель: х · 3 = 6; х = 6 : 3; х = 2."]}]},
 {id:"v6",n:"6",title:"Частное",body:[
  {ex:"6 (делимое) : 3 (делитель) = 2 (частное)"},
  {ol:["Самое большое число в частном — делимое.","Частное равно 1, если делимое равно делителю: 9 : 9 = 1, т. е. а : а = 1.","Частное равно 0, если делимое равно 0: 0 : 8 = 0, т. е. 0 : а = 0.","На 0 делить нельзя.","Делимое равно частному, если делитель равен 1: 7 : 1 = 7, т. е. а : 1 = а.","Чтобы найти неизвестное делимое, нужно делитель умножить на частное: х : 3 = 2; х = 3 · 2; х = 6.","Чтобы найти неизвестный делитель, нужно делимое разделить на частное: 6 : х = 2; х = 6 : 2; х = 3."]}]},
 {id:"v7",n:"7",title:"Прибавление числа к сумме и суммы к числу",body:[
  {p:"Прибавить число к сумме можно тремя способами:"},
  {ol:["Вычислить сумму и прибавить к ней число.","Число прибавить к I слагаемому и потом прибавить II слагаемое.","Число прибавить ко II слагаемому и потом прибавить I слагаемое."]},
  {ex:"(4 + 5) + 1 = 9 + 1 = 10<br>(4 + 5) + 1 = 5 + 5 = 10<br>(4 + 5) + 1 = 4 + 6 = 10"},
  {p:"Это правило можно использовать при решении примеров типа 13 + 5; 28 + 3:"},
  {ex:"13 + 5 = (10 + 3) + 5 = 10 + 8 = 18<br>28 + 3 = (20 + 8) + 3 = 20 + 11 = 31"},
  {p:"Прибавить сумму к числу тоже можно тремя способами:"},
  {ex:"3 + (2 + 4) = 3 + 6 = 9<br>3 + (2 + 4) = 5 + 4 = 9<br>3 + (2 + 4) = 7 + 2 = 9"},
  {p:"Это правило можно использовать при решении примеров типа 8 + 7:"},
  {ex:"8 + 7 = 8 + (2 + 5) = 10 + 5 = 15"}]},
 {id:"v8",n:"8",title:"Вычитание числа из суммы и суммы из числа",body:[
  {p:"Вычесть число из суммы можно тремя способами:"},
  {ol:["Вычислить сумму и вычесть из неё число.","Вычесть число из I слагаемого и прибавить II слагаемое.","Вычесть число из II слагаемого и прибавить I слагаемое."]},
  {ex:"(7 + 3) − 2 = 10 − 2 = 8<br>(7 + 3) − 2 = 5 + 3 = 8<br>(7 + 3) − 2 = 7 + 1 = 8"},
  {ex:"15 − 4 = (10 + 5) − 4 = 10 + 1 = 11<br>30 − 9 = (20 + 10) − 9 = 20 + 1 = 21"},
  {p:"Вычесть сумму из числа можно тремя способами:"},
  {ex:"9 − (3 + 4) = 9 − 7 = 2<br>9 − (3 + 4) = 6 − 4 = 2<br>9 − (3 + 4) = 5 − 3 = 2"},
  {ex:"15 − 8 = 15 − (5 + 3) = 7<br>34 − 7 = 34 − (4 + 3) = 27"}]},
 {id:"v9",n:"9",title:"Умножение числа на сумму и суммы на число",body:[
  {p:"Умножить число на сумму можно двумя способами: вычислить сумму и умножить на неё число; умножить число на каждое слагаемое и полученные результаты сложить."},
  {ex:"5 · (3 + 4) = 5 · 7 = 35<br>5 · (3 + 4) = 15 + 20 = 35"},
  {ex:"6 · 28 = 6 · (20 + 8) = 120 + 48 = 168"},
  {ex:"(3 + 4) · 5 = 7 · 5 = 35<br>(3 + 4) · 5 = 3 · 5 + 4 · 5 = 35"},
  {ex:"34 · 3 = (30 + 4) · 3 = 90 + 12 = 102"}]},
 {id:"v10",n:"10",title:"Деление суммы на число",body:[
  {p:"Разделить сумму на число можно двумя способами: вычислить сумму и разделить её на число; каждое из слагаемых разделить на число и результаты сложить."},
  {ex:"(6 + 9) : 3 = 15 : 3 = 5<br>(6 + 9) : 3 = 2 + 3 = 5"},
  {ex:"39 : 3 = (30 + 9) : 3 = 10 + 3 = 13<br>64 : 4 = (40 + 24) : 4 = 10 + 6 = 16"}]},
 {id:"v11",n:"11",title:"Порядок действий",body:[
  {rule:"В примерах без скобок сначала выполняются действия умножения и деления, а затем — остальные по порядку."},
  {ex:"34 + 8 : 2 − 16 + 12 · 3<br>порядок: 8 : 2 → 12 · 3 → 34 + 4 → 38 − 16 → 22 + 36"},
  {rule:"В примерах со скобками сначала выполняются действия в скобках, затем умножение и деление, а потом все остальные действия по порядку."},
  {ex:"59 − (45 + 72) : 9 + 14 · (14 − 8) + 7<br>порядок: (45 + 72) → (14 − 8) → 117 : 9 → 14 · 6 → 59 − 13 → 46 + 84 → 130 + 7"}]},

  {table:{cls:"c",head:["= 7","= 8","= 9","= 10"],rows:[["1+6<br>2+5<br>3+4<br>4+3<br>5+2<br>6+1","1+7<br>2+6<br>3+5<br>4+4<br>5+3<br>6+2<br>7+1","1+8<br>2+7<br>3+6<br>4+5<br>5+4<br>6+3<br>7+2<br>8+1","1+9<br>2+8<br>3+7<br>4+6<br>5+5<br>6+4<br>7+3<br>8+2<br>9+1"]]}},

 {id:"v13",n:"13",title:"Сложение и вычитание с переходом через десяток",body:[
  {p:"Выучи наизусть:"},
  {table:{cls:"c",head:["= 11","= 12","= 13","= 14","= 15","= 16","= 17","= 18"],rows:[
   ["5+6<br>7+4<br>8+3<br>9+2","5+7<br>6+6<br>8+4<br>9+3","5+8<br>6+7<br>9+4","5+9<br>6+8<br>7+7","6+9<br>7+8","7+9<br>8+8","8+9","9+9"]]}},
  {reason:"7 + 8: раскладываю 8 на сумму удобных слагаемых так, чтобы 7 дополнить до 10 — 8 это 3 и 5, значит 7 + 3 + 5 = 15.<br>4 + 8: удобнее к большему числу прибавить меньшее, значит 8 + 4, дальше рассуждаем как в первом случае."},
  {reason:"12 − 5: раскладываю 5 на сумму удобных слагаемых так, чтобы 12 уменьшить до 10 — 5 это 2 и 3, значит 12 − 2 − 3 = 7."},
  {reason:"Если ты хорошо запомнил таблицу сложения: 14 − 8 — 14 состоит из 8 и 6; если вычесть 8, останется 6, т. е. 14 − 8 = 6."}]},
 {id:"v14",n:"14",title:"Нумерация чисел от 20 до 100 и от 100 до 1000",body:[
  {h:"Сложение и вычитание круглых чисел"},
  {reason:"20 + 30: 2 дес. + 3 дес. = 5 дес., или число 50. Значит 20 + 30 = 50.<br>200 + 300: 2 сот. + 3 сот. = 5 сот., или число 500. Значит 200 + 300 = 500.<br>Аналогично рассуждай при вычитании круглых чисел."},
  {h:"Сложение круглого числа с однозначным или двузначным"},
  {ex:"40 + 8 — 4 дес. и 8 ед. — число 48, т. е. 40 + 8 = 48<br>200 + 30 — 2 сот. и 3 дес. — число 230, т. е. 200 + 30 = 230"},
  {h:"Сложение двузначного и однозначного числа"},
  {reason:"23 + 6: число 23 раскладываю на сумму удобных слагаемых (20 и 3), единицы складываем с единицами: 20 + (3 + 6) = 29.<br>520 + 30 = 500 + (20 + 30) = 550."},
  {h:"Сложение двузначных и трёхзначных чисел"},
  {ex:"45 + 30 = (40 + 30) + 5 = 75<br>360 + 500 = (300 + 500) + 60 = 860<br>Аналогично рассуждай при вычитании."}]},
 {id:"v15",n:"15",title:"Сложение и вычитание двузначных чисел",body:[
  {h:"Сложение"},
  {ex:"25 + 7 = 30 + 2 = 32 &nbsp;(7 это 5 и 2)<br>или 25 + 7 = 20 + (5 + 7) = 20 + 12 = 32"},
  {ex:"25 + 43 = (20 + 40) + (5 + 3) = 60 + 8 = 68"},
  {ex:"37 + 29 = 37 + 20 + 9 = 66<br>или (30 + 20) + (7 + 9) = 66"},
  {h:"Вычитание"},
  {ex:"50 − 8 = 40 + (10 − 8) = 42"},
  {ex:"50 − 18: 50 − 10 = 40, затем 40 − 8 = 32"},
  {ex:"36 − 13: 36 − 10 = 26, затем 26 − 3 = 23"},
  {ex:"52 − 7 = 52 − 2 − 5 = 45"},
  {ex:"84 − 49: 84 − 40 = 44, затем 44 − 9 = 35"}]},

 {id:"v17",n:"17",title:"Внетабличное умножение и деление",body:[
  {ex:"25 · 3 = 20 · 3 + 5 · 3 = 60 + 15 = 75 &nbsp;(25 это 20 и 5)"},
  {h:"Деление двузначного числа на однозначное"},
  {reason:"64 : 4 — раскладываю число 64 на сумму удобных слагаемых (40 и 24): 40 : 4 + 24 : 4 = 10 + 6 = 16."},
  {p:"Удобные слагаемые при делении:"},

   ["20, 40, 60, 80","30, 60, 90","40, 80","50","60","70","80","90"]]}},
  {h:"Деление двузначного числа на двузначное"},
  {reason:"39 : 13 — решаем методом подбора. Пробуем 2: 13 · 2 = 26 — не подходит. Пробуем 3: 13 · 3 = 39, значит 39 : 13 = 3."}]},
 {id:"v18",n:"18",title:"Деление с остатком",body:[
  {ol:["Подбираем ближайшее число, меньшее делимого, которое делится на делитель без остатка. Для 26 : 4 это число 24.","Делим это число: 24 : 4 = 6. Получили частное.","Находим остаток: 26 − 24 = 2. Значит 26 : 4 = 6 (ост. 2)."]},
  {h:"Проверка"},
  {ol:["Остаток не может быть больше делителя: 2 меньше 4.","Умножаем частное на делитель и прибавляем остаток — должно получиться делимое: 6 · 4 + 2 = 26."]}]},

 {id:"v19",n:"19",title:"Письменное сложение",body:[
  {h:"Без перехода через десяток"},
  {ol:["Подписываем одно число под другим так, чтобы единицы были под единицами, десятки под десятками и т. д.","Складываем единицы с единицами, десятки с десятками и т. д."]},
  {pre:"   2363\n +  231\n ───────\n   2594"},
  {h:"С переходом через десяток"},
  {ol:["Складываем единицы: 5 + 8 = 13, 3 единицы пишем, 1 десяток запоминаем.","Складываем десятки: 4 дес. + 7 дес. = 11 дес. и 1 дес. запомнили — 12 дес. 2 дес. пишем, 1 сотню запоминаем.","Складываем сотни: 9 сот. + 2 сот. = 11 сот. и 1 сот. запомнили — 12 сот. 2 сот. пишем, 1 тысячу запоминаем.","Смотрим на разряд тысяч: 7 тыс. и 1 тысяча запомненная — 8 тыс."]},
  {pre:"   7945\n +  278\n ───────\n   8223"}]},
 {id:"v20",n:"20",title:"Письменное вычитание",body:[
  {h:"Без перехода через десяток"},
  {pre:"   3674\n −  231\n ───────\n   3443"},
  {h:"С переходом через десяток"},
  {ol:["Вычитаем единицы: из 4 нельзя вычесть 5. Занимаем 1 десяток: из 14 вычесть 5 — будет 9.","Вычитаем десятки: в уменьшаемом было 6 дес., 1 десяток заняли, осталось 5 дес. Из 5 десятков нельзя вычесть 9 десятков. Занимаем 1 сотню: 15 дес. − 9 дес. = 6 дес.","Вычитаем сотни: было 3 сотни, 1 сотню заняли, осталось 2 сотни. 2 сот. − 2 сот. = 0 сот.","Смотрим на тысячи: они остаются без изменений."]},
  {pre:"   7364\n −  295\n ───────\n   7069"},
  {h:"Из круглого числа"},
  {rule:"Запомни правило: если над 0 стоит точка, то это не 0, а 9."},
  {ol:["Вычитаем единицы: из 0 нельзя вычесть 4. Занимаем 1 десяток у 0 — у 0 нельзя занять, идём дальше. Занимаем у 3 тысяч. Из 10 вычесть 4 — будет 6.","Вычитаем десятки: если над 0 стоит точка, то это не 0, а 9. Из 9 вычесть 2 — будет 7.","Вычитаем сотни: из 9 вычесть 5 — будет 4.","Смотрим на тысячи: у 3 тысяч мы занимали 1 тысячу, осталось 2. Читаем ответ: 2476."]},
  {pre:"   3000\n −  524\n ───────\n   2476"}]},
 {id:"v21",n:"21",title:"Письменное умножение",body:[
  {h:"Многозначного числа на однозначное"},
  {ol:["Напишем однозначное число под единицами многозначного.","Умножаем единицы: 6 · 4 = 24, 4 единицы пишем, 2 дес. запоминаем.","Умножаем десятки: 4 дес. · 4 = 16 дес., 2 дес. запомнили — 18 дес. 8 десятков пишем, 1 сотню запоминаем.","Умножаем сотни: 3 сот. · 4 = 12 сот., 1 сотню запомнили — 13 сот."]},
  {pre:"    346\n ×    4\n ───────\n   1384"},
  {h:"На двузначное, трёхзначное число"},
  {ol:["Подписываем множители друг под другом так, чтобы единицы были под единицами, десятки под десятками.","Находим первое неполное произведение.","Второе неполное произведение начинай писать под первым, сдвинув его на один знак влево.","Сложи неполные произведения."]},
  {pre:"     427\n ×    36\n ────────\n    2562\n + 1281\n ────────\n   15372"},
  {h:"На круглое число"},
  {ol:["Подписываем множители один под другим так, чтобы нули остались в стороне.","Выполняем умножение, не обращая внимания на нули.","Подсчитываем количество нулей в обоих множителях и эти нули приписываем к произведению."]},
  {pre:"    3490\n ×  2400\n ──────────\n    1396\n + 698\n ──────────\n   8376000"},
  {h:"С нулём в середине множителя"},
  {ol:["Подписываем множители один под другим.","Находим первое неполное произведение.","При умножении на 0 в результате получается 0, поэтому эту строку писать не будем, а сдвинем следующее неполное произведение ещё на один знак влево.","Находим следующее неполное произведение и складываем."]},
  {pre:"     231\n ×   504\n ─────────\n     924\n + 1155\n ─────────\n  116424"}]},
 {id:"v22",n:"22",title:"Письменное деление",body:[
  {h:"Многозначного числа на однозначное"},
  {ol:["Записываем частное уголком.","Определяем первое неполное делимое — наименьшее число, которое делится на делитель. 2 на 3 разделить нельзя, берём 25.","Определяем количество цифр в частном.","Разделим первое неполное делимое, узнаем, сколько единиц не разделили. 25 : 3 — ближайшее меньшее число, которое делится на 3 без остатка, это 24. 24 : 3 = 8. 8 записываем в частное. Из 25 вычитаем 24. Не разделили 1.","Проверяем: остаток не может быть больше делителя. 1 меньше 3 — верно.","Сносим следующую цифру. Делим полученное число в том же порядке."]},
  {pre:"  2541 │ 3\n −24    ├────\n ────   │ 847\n   14\n  −12\n  ────\n    21\n   −21\n   ────\n     0"},
  {h:"Случаи деления с 0 в частном"},
  {ol:["Выполняем первые шаги как обычно.","Сносим следующую цифру. Число 3 нельзя разделить на 4. Пишем в частное 0.","Сносим следующую цифру. Делим полученное число: 32 : 4 = 8. Результат записываем в частное.","Последняя цифра делимого — 0. Переносим её в частное."]},
  {pre:"  24320 │ 4\n −24     ├──────\n ────    │ 6080\n    032\n    −32\n    ────\n      0"},
  {h:"На круглое число"},
  {ol:["Определяем первое неполное делимое и количество цифр в частном.","276 и 80 разделим на 10: 27 : 8 — получим 3. Узнаём, сколько единиц разделили: 80 · 3 = 240; сколько не разделили: 276 − 240 = 36. Проверяем: 36 меньше 80.","Сносим следующую цифру и продолжаем деление в том же порядке."]},
  {pre:"  27680 │ 80\n −240    ├─────\n ─────   │ 346\n    368\n   −320\n   ─────\n     480\n    −480\n    ─────\n       0"},

    if(t.short) h+=shortHTML(t.short);
    if(t.cols) h+=colsHTML(t.cols);
    if(t.draw) h+='<div class="draw">'+(t.draw.type==="tri"?svgTri(t.draw):svgMove(t.draw))+(t.draw.cap?'<div class="cap">'+t.draw.cap+'</div>':"")+'</div>';
    if(t.reason) h+='<div class="reason"><span class="lb">Рассуждай так</span>'+t.reason+'</div>';
    if(t.sol&&t.sol.length) h+='<div class="sol">'+t.sol.map(function(s){return "<div>"+s+"</div>";}).join("")+'</div>';
    if(t.ans) h+='<p class="ans"><span>Ответ:</span>'+t.ans+'</p>';
    d.innerHTML=h; return d;
  }
  return el("p",null,"");
}

/* ---------- pages ---------- */
function renderHome(){
  state.subj=null; state.sect=null; markNav(); tbt.textContent="Справочник";
  var box=el("div","home");
  box.appendChild(el("h2","sect","Справочник для начальных классов"));
  box.appendChild(el("p","lede","Весь курс 1—3 классов по русскому языку и математике плюс памятки по чтению. Открывайте раздел в меню слева или ищите правило по слову — например, «жи-ши», «падеж», «периметр»."));
  var cards=el("div","cards");
  DATA.forEach(function(su){
    var c=el("button","card"); c.style.setProperty("--k",su.color);
    c.innerHTML="<h3>"+su.title+"</h3><p>"+su.desc+"</p>";
    c.addEventListener("click",function(){go(su.id,su.sections[0].id);});
    cards.appendChild(c);
  });
  box.appendChild(cards);
  box.appendChild(el("div","meta","Т. В. Шклярова. Справочник для начальных классов. — Чебоксары: Чувашское книжное издательство, 1995. — 96 с.<br>Текст, таблицы, схемы и чертежи набраны по книге — в том числе те, что напечатаны картинками и не читаются распознаванием. Пояснения и списки слов, дописанные сверх книги, помечены прямо в тексте."));
  view.innerHTML=""; view.appendChild(box); window.scrollTo(0,0);
}

function findSubj(id){for(var i=0;i<DATA.length;i++) if(DATA[i].id===id) return DATA[i]; return null;}
function findSect(su,id){for(var i=0;i<su.sections.length;i++) if(su.sections[i].id===id) return su.sections[i]; return null;}

function renderSection(subjId,sectId,openTopicId,term){
  var su=findSubj(subjId); if(!su) return renderHome();
  var se=findSect(su,sectId)||su.sections[0];
  state.subj=su.id; state.sect=se.id; markNav(); tbt.textContent=se.title;
  view.innerHTML="";
  var root=el("div"); root.style.setProperty("--k",su.color);
  root.appendChild(el("div","crumb","<b>"+su.title+"</b>"));
  root.appendChild(el("h2","sect",se.title));
  if(se.lead) root.appendChild(el("p","sect-sub",se.lead));
  var tools=el("div","toolrow");
  var bAll=el("button",null,"Развернуть всё"), bNone=el("button",null,"Свернуть всё");
  tools.appendChild(bAll); tools.appendChild(bNone); root.appendChild(tools);

  var topics=[];
  se.topics.forEach(function(t){
    var box=el("div","topic");
    var head=el("button","th");
    head.innerHTML='<span class="num">'+(t.n||"·")+'</span><span class="tt">'+t.title+'</span><span class="sign">✕</span>';
    var body=el("div","body");
    t.body.forEach(function(b){ body.appendChild(renderBlock(b)); });
    head.addEventListener("click",function(){ box.classList.toggle("open"); });
    box.appendChild(head); box.appendChild(body); root.appendChild(box);
    topics.push({box:box,id:t.id});
  });
  bAll.addEventListener("click",function(){topics.forEach(function(o){o.box.classList.add("open");});});
  bNone.addEventListener("click",function(){topics.forEach(function(o){o.box.classList.remove("open");});});
  view.appendChild(root);

  if(openTopicId){
    var hit=null; topics.forEach(function(o){ if(o.id===openTopicId) hit=o.box; });
    if(hit){
      hit.classList.add("open");
      if(term) highlight(hit,term);
      setTimeout(function(){ if(hit.scrollIntoView) hit.scrollIntoView({block:"start",behavior:"smooth"}); },30);
      return;
    }
  }
  window.scrollTo(0,0);
}

/* ---------- highlight ---------- */
function highlight(root,term){
  if(!term) return;
  var src="("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")";
  var test=new RegExp(src,"i"), re=new RegExp(src,"gi");
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
  while((n=walker.nextNode())) if(n.nodeValue&&test.test(n.nodeValue)) nodes.push(n);
  nodes.forEach(function(node){
    var span=document.createElement("span");
    span.innerHTML=esc(node.nodeValue).replace(re,"<mark>$1</mark>");
    node.parentNode.replaceChild(span,node);
  });
}

/* ---------- search ---------- */
function snippet(text,term){
  var i=text.toLowerCase().indexOf(term.toLowerCase());
  if(i<0) return text.slice(0,140)+(text.length>140?"…":"");
  var s=Math.max(0,i-55), e=Math.min(text.length,i+term.length+95);
  return (s>0?"…":"")+esc(text.slice(s,e)).replace(new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")+(e<text.length?"…":"");
}
function runSearch(term){
  var t=norm(term.trim());
  if(t.length<1){ renderHome(); return; }
  var hits=INDEX.filter(function(r){return r.text.indexOf(t)>-1;}).slice(0,60);
  view.innerHTML="";
  var box=el("div","res");
  box.appendChild(el("p","h", hits.length? "Найдено разделов: "+hits.length : ""));
  if(!hits.length){
    box.appendChild(el("p","empty","Ничего не нашлось. Попробуйте другое слово — например, «падеж», «дробь», «приставка», «периметр»."));
  }
  hits.forEach(function(r){
    var b=el("button","hit"); b.style.setProperty("--k",r.subj.color);
    b.innerHTML='<div class="path">'+r.subj.title+" · "+r.sect.title+'</div>'+
                '<div class="t">'+r.topic.title+'</div>'+
                '<div class="sn">'+snippet(r.body,term.trim())+'</div>';
    b.addEventListener("click",function(){
      closeMenu();
      renderSection(r.subj.id,r.sect.id,r.topic.id,term.trim());
    });
    box.appendChild(b);
  });
  view.appendChild(box); window.scrollTo(0,0);
  tbt.textContent="Поиск";
}

/* ---------- navigation ---------- */
function go(subjId,sectId){ q.value=""; sb.classList.remove("has"); closeMenu(); renderSection(subjId,sectId); }
function closeMenu(){ document.body.classList.remove("menu"); }

var timer=null;
q.addEventListener("input",function(){
  sb.classList.toggle("has", q.value.length>0);
  clearTimeout(timer);
  timer=setTimeout(function(){
    if(q.value.trim().length<1){ if(state.subj) renderSection(state.subj,state.sect); else renderHome(); }
    else runSearch(q.value);
  },160);
});
q.addEventListener("keydown",function(e){ if(e.key==="Escape"){ q.value=""; sb.classList.remove("has"); renderHome(); } });
clr.addEventListener("click",function(){ q.value=""; sb.classList.remove("has"); q.focus(); renderHome(); });
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&document.activeElement!==q){ e.preventDefault(); q.focus(); }
});
burger.addEventListener("click",function(){ document.body.classList.toggle("menu"); });
scrim.addEventListener("click",closeMenu);

buildNav();
renderHome();
})();

</script>
</body>
</html>
